# Token Plan 个人版套餐成员（模型 ID 用官方原始大小写，调用也支持全小写）；
# 能力与长度同 MaaS 按量版本，纯订阅无按 token 计价。
base_model = "moonshot/kimi-k2.6"
base_model_omit = ["structured_output"]
endpoints = ["openai", "anthropic"]
doc = "https://support.huaweicloud.com/Token-plan-maas/tokenplan-maas-0001.html"
attachment = false
temperature = false
structured_output = false

[[reasoning_options]]
type = "toggle"
field = "chat_template_kwargs.thinking"
endpoints = ["openai"]

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["anthropic"]

[interleaved]
field = "reasoning_content"

[limit]
context = 262_144
input = 262_144
output = 98_304

[modalities]
input = ["text"]
output = ["text"]
