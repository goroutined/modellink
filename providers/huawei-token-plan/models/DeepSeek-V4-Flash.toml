# Token Plan 个人版套餐成员（模型 ID 用官方原始大小写，调用也支持全小写）；
# 能力与长度同 MaaS 按量版本，纯订阅无按 token 计价。
base_model = "deepseek/deepseek-v4-flash"
base_model_omit = ["structured_output"]
endpoints = ["openai", "anthropic"]
doc = "https://support.huaweicloud.com/Token-plan-maas/tokenplan-maas-0001.html"
temperature = false
structured_output = false

[[reasoning_options]]
type = "toggle"
field = "chat_template_kwargs.thinking"
endpoints = ["openai"]

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["anthropic"]

# 两种协议均明确 DeepSeek-V4 系列使用 reasoning_effort，思考模式下生效。
# https://support.huaweicloud.com/model-call-maas/model-call-021.html
# https://support.huaweicloud.com/model-call-maas/model-call-022.html
[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai", "anthropic"]
values = ["high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 1_048_576
output = 393_216
