# 三协议与能力来自模型页服务器渲染的 initialModels 型号级精确数据
# （endpoints: chat/completions, anthropic, responses；输入模态含 audio，与小米 canonical 一致）。
base_model = "xiaomi/mimo-v2.6-pro"
base_model_omit = ["temperature", "interleaved"]
endpoints = ["openai", "anthropic", "responses"]
doc = "https://ppio.com/llm/xiaomimimo-mimo-v2.6-pro"

[limit]
context = 1_048_576
output = 131_072

[cost_cn]
input = 3
output = 6
cache_read = 0.025
