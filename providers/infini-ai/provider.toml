name = "无问芯穹 GenStudio"
env = ["GENSTUDIO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
protocol = "openai-compatible"
api = "https://cloud.infini-ai.com/maas/v1"
doc = "https://docs.infini-ai.com/gen-studio/models/"

[links]
models = "https://cloud.infini-ai.com/genstudio/usage/limit"
pricing = "https://docs.infini-ai.com/gen-studio/api/usage-and-billing/billing.html"
api_key = "https://docs.infini-ai.com/gen-studio/api/get-started/"
console = "https://cloud.infini-ai.com/iam/secret/key"

[[endpoints]]
id = "openai"
protocol = "openai-compatible"
api = "https://cloud.infini-ai.com/maas/v1"
default = true

# 2026-11-19 官方 Kimi Code 配置给出 Responses 接入（base_url 同 maas/v1，
# type=openai_responses），补充端点定义。
[[endpoints]]
id = "responses"
protocol = "openai-responses"
api = "https://cloud.infini-ai.com/maas/v1"

[[endpoints]]
id = "anthropic"
protocol = "anthropic-compatible"
api = "https://cloud.infini-ai.com/maas"
