base_model = "zhipu/glm-5.2"
endpoints = ["openai", "anthropic", "responses"]
doc = "https://bailian.console.aliyun.com/cn-beijing/?tab=model#/model-market/detail/glm-5.2"

[[reasoning_options]]
type = "toggle"
field = "enable_thinking"
endpoints = ["openai", "responses"]

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["anthropic"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["high", "max"]
default = "max"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
default = "xhigh"

[[reasoning_options]]
type = "budget_tokens"
field = "thinking.budget_tokens"
endpoints = ["anthropic"]

[interleaved]
field = "reasoning_content"

[limit]
# 国区匿名 listFoundationModels 精确型号 contextWindow（2026-09-11）。
context = 1_000_000
input = 1_048_576

[cost_cn]
input = 8
output = 28
cache_read = 2
