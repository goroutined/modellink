base_model = "deepseek/deepseek-v4-flash-0731"
endpoints = ["openai", "anthropic", "responses"]
doc = "https://bailian.console.aliyun.com/cn-beijing/?tab=model#/model-market/detail/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash 0731"
structured_output = true

[[reasoning_options]]
type = "toggle"
field = "enable_thinking"
endpoints = ["openai", "responses"]

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["anthropic"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[limit]
context = 1_000_000
input = 1_000_000
output = 393_216

[cost_cn]
label = "闲时"
input = 1.5
output = 4.5
cache_read = 0.15

[[cost_cn.tiers]]
label = "忙时"
input = 3
output = 9
cache_read = 0.3

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "09:00"
end = "12:00"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "14:00"
end = "18:00"
