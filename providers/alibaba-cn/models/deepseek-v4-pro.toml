base_model = "deepseek/deepseek-v4-pro"
endpoints = ["openai", "anthropic"]
doc = "https://bailian.console.aliyun.com/cn-beijing/?tab=model#/model-market/detail/deepseek-v4-pro"

[[reasoning_options]]
type = "toggle"
field = "enable_thinking"
endpoints = ["openai"]

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["anthropic"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["high", "max"]
default = "max"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_000_000
input = 1_000_000
output = 393_216

[cost_cn]
input = 12
output = 24
cache_read = 1
