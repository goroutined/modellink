name = "Xiaomi MiMo"
env = ["MIMO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
protocol = "openai-compatible"
api = "https://api.xiaomimimo.com/v1"
doc = "https://mimo.mi.com/docs/zh-CN/quick-start/summary/model"

[links]
models = "https://mimo.mi.com/docs/zh-CN/quick-start/summary/model"
pricing = "https://mimo.mi.com/docs/zh-CN/price/pay-as-you-go"
api_key = "https://mimo.mi.com/docs/zh-CN/quick-start/faq/api-integration"
console = "https://platform.xiaomimimo.com/#/console/api-keys"

[[endpoints]]
id = "openai"
protocol = "openai-compatible"
api = "https://api.xiaomimimo.com/v1"
default = true

[[endpoints]]
id = "responses"
protocol = "openai-responses"
api = "https://api.xiaomimimo.com/v1"

[[endpoints]]
id = "anthropic"
protocol = "anthropic-compatible"
api = "https://api.xiaomimimo.com/anthropic"
