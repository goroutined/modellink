base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"
# 2026-09-14 12:00（北京时间）之后才路由到 V4.1 Flash；当前保留 Pro 映射和价格。
# https://api-docs.deepseek.com/zh-cn/quick_start/pricing
endpoints = ["openai", "anthropic", "responses"]
doc = "https://api-docs.deepseek.com/zh-cn/guides/thinking_mode"
# 当前默认思考模式不支持调温。API 明确 max_tokens 最大为 384K（393216）。
# https://api-docs.deepseek.com/zh-cn/api/create-chat-completion/
temperature = false

[limit]
output = 393_216

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "anthropic"]

[[reasoning_options]]
type = "toggle"
field = "reasoning.effort"
endpoints = ["responses"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["low", "high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["low", "high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[cost_cn]
label = "闲时"
input = 4.5
output = 13.5
cache_read = 0.15

[[cost_cn.tiers]]
label = "高峰"
input = 9
output = 27
cache_read = 0.3

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "09:00"
end = "12:00"
holiday = "exclude_cn_statutory"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "14:00"
end = "18:00"
holiday = "exclude_cn_statutory"
