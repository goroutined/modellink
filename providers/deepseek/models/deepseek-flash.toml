# V4.1 Flash 官方当前推荐调用 ID。
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek Flash"
endpoints = ["openai", "anthropic", "responses"]
doc = "https://api-docs.deepseek.com/zh-cn/quick_start/pricing"
# 默认思考模式下 temperature 不生效；API 文档明确最大输出 393216。
temperature = false

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "anthropic"]

[[reasoning_options]]
type = "toggle"
field = "reasoning.effort"
endpoints = ["responses"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["low", "high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["low", "high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[cost_cn]
input = 1
output = 4
cache_read = 0.02

[[cost_cn.tiers]]
input = 1
output = 4
cache_read = 0.02

[cost_cn.tiers.tier]
type = "conditional"
label = "闲时"

[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.tier.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "00:00"
end = "09:00"

[[cost_cn.tiers.tier.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "12:00"
end = "14:00"

[[cost_cn.tiers.tier.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "18:00"
end = "24:00"

[[cost_cn.tiers.tier.time.windows]]
days = ["saturday", "sunday"]
start = "00:00"
end = "24:00"

[[cost_cn.tiers]]
input = 2
output = 8
cache_read = 0.04

[cost_cn.tiers.tier]
type = "conditional"
label = "高峰"

[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.tier.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "09:00"
end = "12:00"

[[cost_cn.tiers.tier.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "14:00"
end = "18:00"
