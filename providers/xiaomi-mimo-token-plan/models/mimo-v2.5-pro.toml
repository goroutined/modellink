base_model = "xiaomi/mimo-v2.5-pro"
endpoints = ["openai", "responses", "anthropic"]
doc = "https://mimo.mi.com/docs/zh-CN/quick-start/faq/token-plan"
temperature = true

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "anthropic"]

[[reasoning_options]]
type = "toggle"
field = "reasoning.effort"
endpoints = ["responses"]

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
output = 131_072

[cost_points]
per_tokens = 1
input = 300
output = 600
cache_read = 2.5
off_peak_multiplier = 0.8

[cost_points.peak_window]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "08:00"
end = "00:00"
timezone = "Asia/Shanghai"
