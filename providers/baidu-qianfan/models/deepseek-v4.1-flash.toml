base_model = "deepseek/deepseek-v4.1-flash"
base_model_omit = ["reasoning", "tool_call", "structured_output"]
attachment = false
doc = "https://cloud.baidu.com/doc/qianfan/s/rmh4stp0j"

[limit]
context = 1_000_000
input = 1_000_000
output = 393_216

[modalities]
input = ["text"]
output = ["text"]

[cost_cn]
label = "空闲"
input = 1
output = 4
cache_read = 0.02

[[cost_cn.tiers]]
label = "高峰"
input = 2
output = 8
cache_read = 0.04

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "08:00"
end = "22:00"
