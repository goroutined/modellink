base_model = "deepseek/deepseek-v4-flash-0731"
base_model_omit = ["temperature", "tool_call", "structured_output", "reasoning_options", "interleaved"]
endpoints = ["openai", "anthropic"]
doc = "https://cloud.baidu.com/doc/qianfan/s/rmh4stp0j"
reasoning = true

[limit]
context = 1_000_000
input = 1_000_000
output = 393_216

[cost_cn]
label = "空闲"
input = 1.5
output = 4.5
cache_read = 0.05

[[cost_cn.tiers]]
label = "高峰"
input = 3
output = 9
cache_read = 0.1

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "08:00"
end = "22:00"
