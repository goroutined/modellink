base_model = "deepseek/deepseek-v4-flash-0731"
base_model_omit = ["temperature", "tool_call", "structured_output", "reasoning_options", "interleaved"]
endpoints = ["openai", "anthropic"]
doc = "https://cloud.baidu.com/doc/qianfan/s/rmh4stp0j"
reasoning = true

[limit]
context = 1_000_000
input = 1_000_000
output = 393_216

[cost_cn]
input = 3
output = 9
cache_read = 0.1

[[cost_cn.tiers]]
input = 3
output = 9
cache_read = 0.1

[cost_cn.tiers.tier]
type = "conditional"
label = "高峰"

[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.tier.time.windows]]
start = "08:00"
end = "22:00"

[[cost_cn.tiers]]
input = 1.5
output = 4.5
cache_read = 0.05

[cost_cn.tiers.tier]
type = "conditional"
label = "空闲"

[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.tier.time.windows]]
start = "22:00"
end = "24:00"

[[cost_cn.tiers.tier.time.windows]]
start = "00:00"
end = "08:00"
