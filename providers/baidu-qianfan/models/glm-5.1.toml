base_model = "zhipu/glm-5.1"
base_model_omit = ["temperature", "tool_call"]
endpoints = ["openai", "responses", "anthropic"]
doc = "https://cloud.baidu.com/doc/qianfan/s/rmh4stp0j"

[limit]
context = 198_000
input = 198_000
output = 131_072

[cost_cn]
input = 6
output = 24
cache_read = 1.3

[[cost_cn.tiers]]
input = 6
output = 24
cache_read = 1.3
[cost_cn.tiers.when]
type = "conditional"
[cost_cn.tiers.when.input]
lt = 32_000

[[cost_cn.tiers]]
input = 8
output = 28
cache_read = 2
[cost_cn.tiers.when]
type = "conditional"
[cost_cn.tiers.when.input]
gt = 32_000
lte = 200_000
