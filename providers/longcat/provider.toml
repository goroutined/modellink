name = "LongCat API"
env = ["LONGCAT_API_KEY"]
npm = "@ai-sdk/openai-compatible"
protocol = "openai-compatible"
api = "https://api.longcat.chat/openai"
doc = "https://longcat.chat/platform/docs/zh/APIDocs.html"

[[endpoints]]
id = "openai"
protocol = "openai-compatible"
api = "https://api.longcat.chat/openai"
default = true

[[endpoints]]
id = "anthropic"
protocol = "anthropic-compatible"
api = "https://api.longcat.chat/anthropic"

[[endpoints]]
id = "responses"
protocol = "openai-responses"
api = "https://api.longcat.chat/openai/v1"
