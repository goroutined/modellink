base_model = "xiaomi/mimo-v2.6-pro"
endpoints = ["openai", "responses", "anthropic"]
doc = "https://mimo.mi.com/docs/zh-CN/tokenplan/Token%20Plan/subscription"
temperature = true

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "anthropic"]

[[reasoning_options]]
type = "toggle"
field = "reasoning.effort"
endpoints = ["responses"]

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
output = 131_072

[cost_points]
label = "非高峰"
per_tokens = 1
input = 240
output = 480
cache_read = 2

[[cost_points.tiers]]
label = "标准"
input = 300
output = 600
cache_read = 2.5

[cost_points.tiers.when]
type = "conditional"

[cost_points.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_points.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "08:00"
end = "24:00"
