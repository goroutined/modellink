base_model = "stepfun/step-3.5-flash"
endpoints = ["openai", "anthropic"]
doc = "https://platform.stepfun.com/docs/zh/guides/models/step-3.5-flash"

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high"]

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["low", "high"]

[interleaved]
field = "reasoning_content"

[limit]
context = 256_000

[cost_cn]
input = 0.7
output = 2.1
cache_read = 0.14
