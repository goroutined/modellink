base_model = "stepfun/step-3.7-flash"
endpoints = ["openai", "anthropic"]
doc = "https://platform.stepfun.com/docs/zh/guides/models/step-3.7-flash"

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "medium", "high"]
default = "medium"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["low", "medium", "high"]
default = "medium"

[interleaved]
field = "reasoning_content"

[limit]
context = 256_000

[cost_cn]
input = 1.35
output = 8.1
cache_read = 0.27
