base_model = "deepseek/deepseek-v4-flash"
base_model_omit = ["temperature"]
endpoints = ["openai", "anthropic"]
doc = "https://cloud.siliconflow.cn/models?target=deepseek-ai%2FDeepSeek-V4-Flash"

[limit]
context = 1_048_576

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[cost_cn]
label = "其他时间"
input = 3
output = 9
cache_read = 0.3

[[cost_cn.tiers]]
label = "闲时"
input = 1.5
output = 4.5
cache_read = 0.15

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "02:00"
end = "08:00"
