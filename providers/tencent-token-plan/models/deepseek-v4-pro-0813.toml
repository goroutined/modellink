# 2026-11-05 官方 130060 新增非直供行「DeepSeek-V4-Pro 0813 正式版」。
base_model = "deepseek/deepseek-v4-pro-0813"
base_model_omit = ["temperature"]
name = "DeepSeek V4 Pro 0813 正式版"
endpoints = ["openai", "anthropic"]
doc = "https://cloud.tencent.com/document/product/1823/130060"

[limit]
output = 393_216

# 2026-11-24 补 133811 峰谷积分（2026-10-30 22:30 起峰谷计费）：
# 闲时 (90, 270, 3)、高峰 (180, 540, 6) 积分每百万。
[cost_points]
label = "闲时"
per_tokens = 1_000_000
input = 90
output = 270
cache_read = 3

[[cost_points.tiers]]
label = "高峰时段"
input = 180
output = 540
cache_read = 6

[cost_points.tiers.when]
type = "conditional"

[cost_points.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_points.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "09:00"
end = "12:00"

[[cost_points.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "14:00"
end = "18:00"
