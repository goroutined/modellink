base_model = "zhipu/glm-5.3-flash"
base_model_omit = ["temperature", "tool_call", "structured_output", "reasoning_options", "interleaved", "limit.input"]
endpoints = ["openai", "anthropic"]
doc = "https://cloud.tencent.com/document/product/1823/130119"
attachment = true
reasoning = true

# 套餐成员、模态和协议以以上套餐页为准；长度参考腾讯精确型号指南：
# https://cloud.tencent.com/document/product/1823/132061
# 2026-11-27 复核 133811：个人版刊例价已发布（16/56/4.6 积分每百万，
# 即 0.8/2.8/0.23 元），补录 cost_points；限时优惠行（11.2/39.2/3.22）不入库。
[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[cost_points]
per_tokens = 1_000_000
input = 16
output = 56
