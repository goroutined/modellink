name = "MiniMax"
env = ["MINIMAX_API_KEY"]
npm = "@ai-sdk/openai-compatible"
protocol = "openai-compatible"
api = "https://api.minimaxi.com/v1"
doc = "https://platform.minimaxi.com/docs/guides/text-generation"

[links]
models = "https://platform.minimaxi.com/docs/guides/models-intro"
pricing = "https://platform.minimaxi.com/docs/guides/pricing-paygo"
api_key = "https://platform.minimaxi.com/docs/guides/quickstart-preparation"
console = "https://platform.minimax.cn/console/access?tab=api-keys"

[[endpoints]]
id = "openai"
protocol = "openai-compatible"
api = "https://api.minimaxi.com/v1"
default = true

[[endpoints]]
id = "anthropic"
protocol = "anthropic-compatible"
api = "https://api.minimaxi.com/anthropic"

[[endpoints]]
id = "responses"
protocol = "openai-responses"
api = "https://api.minimaxi.com/v1"
