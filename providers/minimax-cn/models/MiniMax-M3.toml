base_model = "minimax/minimax-m3"
endpoints = ["openai", "anthropic", "responses"]
doc = "https://platform.minimaxi.com/docs/guides/text-generation"

# MiniMax 平台固定 temperature=1、top_p=0.95，传入不生效；转售商各自网关可调。
temperature = false

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[provider.body]
reasoning_split = true

[cost_cn]
input = 2.1
output = 8.4
cache_read = 0.42

[[cost_cn.tiers]]
input = 2.1
output = 8.4
cache_read = 0.42

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.input]
lte = 512_000

[[cost_cn.tiers]]
input = 4.2
output = 16.8
cache_read = 0.84

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.input]
gt = 512_000
