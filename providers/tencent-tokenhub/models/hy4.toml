# 2026-11-05 官方核验：130051 新增 Hy4 正式版行（1M/960k/64k，新增图片理解，
# 深度思考为保留式思考），130079 三协议端点全支持，130055 按量价 6/18/0.3。
# effort 档位沿用全平台保留式思考口径（low/high 默认 high），与 hy4-preview 一致。
base_model = "tencent/hy4"
endpoints = ["openai", "responses", "anthropic"]
doc = "https://cloud.tencent.com/document/product/1823/132252"

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 983_040
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]

[cost_cn]
input = 6
output = 18
cache_read = 0.3
