# 2026-09-11：130051 型号表归为原厂直供；130055 价格表采用工作日峰谷、周末全天闲时。
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash 0731 正式版 原厂直供"
endpoints = ["openai", "responses", "anthropic"]
doc = "https://cloud.tencent.com/document/product/1823/132248"

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_000_000
input = 1_000_000
output = 393_216

[cost_cn]
input = 1
output = 4
cache_read = 0.02

[[cost_cn.tiers]]
input = 1
output = 4
cache_read = 0.02

[cost_cn.tiers.tier]
type = "conditional"
label = "闲时"
[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"
windows = [{ days = ["monday", "tuesday", "wednesday", "thursday", "friday"], start = "00:00", end = "09:00" }, { days = ["monday", "tuesday", "wednesday", "thursday", "friday"], start = "12:00", end = "14:00" }, { days = ["monday", "tuesday", "wednesday", "thursday", "friday"], start = "18:00", end = "24:00" }, { days = ["saturday", "sunday"], start = "00:00", end = "24:00" }]

[[cost_cn.tiers]]
input = 2
output = 8
cache_read = 0.04
[cost_cn.tiers.tier]
type = "conditional"
label = "高峰时段"
[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"
windows = [{ days = ["monday", "tuesday", "wednesday", "thursday", "friday"], start = "09:00", end = "12:00" }, { days = ["monday", "tuesday", "wednesday", "thursday", "friday"], start = "14:00", end = "18:00" }]
