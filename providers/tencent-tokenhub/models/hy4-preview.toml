base_model = "tencent/hy4-preview"
name = "Hy4 Preview（即将下线）"
# 2026-11-27 官方 130051/130060/133811 三页标注「将于 2026-12-07 下线」，
# 按 2026-11-05 用户政策加展示名后缀，行消失后再删条目。
endpoints = ["openai", "responses", "anthropic"]
doc = "https://cloud.tencent.com/document/product/1823/132252"

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 983_040
output = 65_536

[cost_cn]
input = 6
output = 18
cache_read = 0.3
