base_model = "xiaomi/mimo-v2.6-flash"
base_model_omit = ["temperature", "interleaved"]
endpoints = ["openai", "responses", "anthropic"]
doc = "https://cloud.tencent.com/document/product/1823/130051"

[limit]
context = 1_000_000
input = 1_000_000
output = 131_072

# 腾讯侧仅证明图片、视频理解，未证明音频输入，不继承小米 canonical 的 audio。
[modalities]
input = ["text", "image", "video"]
output = ["text"]

[cost_cn]
input = 1
output = 2
cache_read = 0.02
