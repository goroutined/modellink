base_model = "bytedance/doubao-seed-2.1-pro"
base_model_omit = ["limit.input", "reasoning", "temperature", "tool_call", "structured_output"]
doc = "https://www.volcengine.com/docs/82379/2366394?lang=zh"

[limit]
context = 1_024_000
output = 262_144

# 2026-11-27 官方表新增「输入模态」列：文本、图片、视频。
[modalities]
input = ["text", "image", "video"]
output = ["text"]
