base_model = "zhipu/glm-5.3-flash"
endpoints = ["openai", "anthropic", "responses"]
doc = "https://docs.bigmodel.cn/cn/coding-plan/latest-model"

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "max"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["low", "high", "max"]
default = "max"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["low", "high", "max"]
default = "max"

[cost_points]
label = "非高峰"
per_tokens = 10_000
input = 1.15
cache_read = 0.28
output = 4

[[cost_points.tiers]]
label = "高峰"
input = 2.3
cache_read = 0.56
output = 8

[cost_points.tiers.when]
type = "conditional"

[cost_points.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_points.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "14:00"
end = "18:00"
