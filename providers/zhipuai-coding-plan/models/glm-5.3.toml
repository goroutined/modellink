base_model = "zhipu/glm-5.3"
endpoints = ["openai", "anthropic"]
doc = "https://docs.bigmodel.cn/cn/coding-plan/latest-model"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost_points]
per_tokens = 10_000
input = 6.9
cache_read = 1.7
output = 24
off_peak_multiplier = 0.5

[cost_points.peak_window]
days = ["monday", "tuesday", "wednesday", "thursday", "friday"]
start = "14:00"
end = "18:00"
timezone = "Asia/Shanghai"
