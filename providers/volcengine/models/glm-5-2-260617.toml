base_model = "zhipu/glm-5.2"
base_model_omit = ["temperature"]
endpoints = ["openai", "responses"]
doc = "https://ark.volcengine.com/region:cn-beijing/model/detail?Id=glm-5-2"
structured_output = false

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "responses"]

# 2026-11-17 官方深度思考文档（82379/1449737）：glm-5-2-260617 与
# glm-5-3-flash-260828 合并行，effort 默认取值由 high 改为 max。
[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["high", "max"]
default = "max"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["high", "max"]
default = "max"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 1_048_576
output = 131_072

[cost_cn]
input = 8
output = 28
cache_read = 2
