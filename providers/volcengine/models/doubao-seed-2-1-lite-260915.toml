doc = "https://ark.volcengine.com/region:cn-beijing/model/detail?Id=doubao-seed-2-1-lite"

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "responses"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
