base_model = "bytedance/doubao-seed-2.1-pro"
base_model_omit = ["temperature"]
name = "Doubao Seed 2.1 Pro 0915"
endpoints = ["openai", "responses"]
doc = "https://ark.volcengine.com/region:cn-beijing/model/detail?Id=doubao-seed-2-1-pro"

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "responses"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["minimal", "low", "medium", "high"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["minimal", "low", "medium", "high"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 1_048_576
output = 262_144

[modalities]
input = ["text", "image", "video", "pdf"]
output = ["text"]

[cost_cn]
input = 6
output = 30
cache_read = 1.2
