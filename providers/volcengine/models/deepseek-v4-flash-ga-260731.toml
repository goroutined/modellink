base_model = "deepseek/deepseek-v4-flash-0731"
base_model_omit = ["temperature"]
name = "DeepSeek V4 Flash GA"
endpoints = ["openai", "responses"]
doc = "https://ark.volcengine.com/region:cn-beijing/model/detail?name=deepseek-v4-flash-ga"
structured_output = true

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai", "responses"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "high"

[[reasoning_options]]
type = "effort"
field = "reasoning.effort"
endpoints = ["responses"]
values = ["low", "high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 1_048_576
output = 393_216

[cost_cn]
input = 3
output = 9
cache_read = 0.1
