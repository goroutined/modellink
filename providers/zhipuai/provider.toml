name = "智谱 AI"
env = ["ZAI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
protocol = "openai-compatible"
api = "https://open.bigmodel.cn/api/paas/v4"
doc = "https://docs.bigmodel.cn/cn/guide/start/model-overview"

[links]
models = "https://docs.bigmodel.cn/cn/guide/start/model-overview"
pricing = "https://open.bigmodel.cn/pricing"
api_key = "https://docs.bigmodel.cn/cn/guide/develop/http/introduction"
console = "https://bigmodel.cn/usercenter/proj-mgmt/apikeys"

[[endpoints]]
id = "openai"
protocol = "openai-compatible"
api = "https://open.bigmodel.cn/api/paas/v4"
default = true

# 2026-11-20 官方发布 Response API 兼容（独立协议，与 Chat Completions 并存），
# 基址 api/v1 与对话补全 paas/v4 分开；默认 store=false、流式不发 [DONE]、暂无 cancel。
[[endpoints]]
id = "responses"
protocol = "openai-responses"
api = "https://open.bigmodel.cn/api/v1"

[[endpoints]]
id = "anthropic"
protocol = "anthropic-compatible"
api = "https://open.bigmodel.cn/api/anthropic"
