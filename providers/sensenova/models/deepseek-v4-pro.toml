base_model = "deepseek/deepseek-v4-pro"
endpoints = ["openai", "anthropic"]
doc = "https://platform.sensenova.cn/docs#model-deepseek-v4-pro"

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "high"

[limit]
context = 1_000_000
output = 393_216
