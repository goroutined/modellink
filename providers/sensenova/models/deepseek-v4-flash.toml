base_model = "deepseek/deepseek-v4-flash"
endpoints = ["openai", "anthropic"]
doc = "https://platform.sensenova.cn/docs#model-deepseek-v4-flash"

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "medium", "high", "none"]
default = "medium"

[[reasoning_options]]
type = "effort"
field = "output_config.effort"
endpoints = ["anthropic"]
values = ["low", "medium", "high"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_000_000
output = 65_536
