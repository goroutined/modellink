# 2026-10-13 官方详情页精确记录：0.8/2.7/0.16（缓存写 1）每 Mt，
# 上下文 1,024,000、最大输出 256,000；能力字段随同系 pro/turbo 惯例省略；
# 模态按 360 结构化数据覆盖（无 pdf），不继承火山 canonical。
base_model = "bytedance/doubao-seed-2.1-lite"
base_model_omit = ["tool_call", "structured_output", "limit.input"]
endpoints = ["openai", "responses"]
doc = "https://ai.360.com/open/zh/models/bytedance/doubao-seed-2-1-lite"

[limit]
context = 1_024_000
output = 256_000

[cost_cn]
input = 0.8
output = 2.7
cache_read = 0.16
cache_write = 1

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]
