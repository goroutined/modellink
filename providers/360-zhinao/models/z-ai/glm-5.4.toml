# 2026-11-26 收录。官方详情页逐字：价格 8/28/2 元每百万，上下文 1,000,000、
# 最大输出 128,000（十进制），支持参数 temperature/top_p/top_k，
# 推理「可切换推理」，响应格式三端点。supportedParameters 无
# tools/response_format，tool_call 与 structured_output 按惯例 omit。
base_model = "zhipu/glm-5.4"
base_model_omit = ["tool_call", "structured_output"]
endpoints = ["openai", "anthropic", "responses"]
doc = "https://ai.360.com/open/zh/models/z-ai/glm-5.4"
temperature = true

[limit]
context = 1_000_000
output = 128_000

[cost_cn]
input = 8
output = 28
cache_read = 2
