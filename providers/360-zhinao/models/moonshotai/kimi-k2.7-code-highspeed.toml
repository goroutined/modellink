base_model = "moonshot/kimi-k2.7-code"
base_model_omit = ["tool_call", "structured_output"]
endpoints = ["openai", "anthropic"]
doc = "https://ai.360.com/open/zh/models/moonshotai/kimi-k2.7-code-highspeed"
temperature = true

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
