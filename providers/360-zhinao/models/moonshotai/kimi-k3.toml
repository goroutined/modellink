base_model = "moonshot/kimi-k3"
base_model_omit = ["tool_call", "structured_output"]
endpoints = ["openai", "anthropic", "responses"]
doc = "https://ai.360.com/open/zh/models/moonshotai/kimi-k3"
temperature = true

[limit]
context = 1_000_000
output = 1_000_000

[modalities]
input = ["text", "image"]
output = ["text"]

[cost_cn]
input = 20
output = 100
cache_read = 2
cache_write = 25
