# 2026-10-23 上线的自部署无审查版；2026-10-28 官方重新配置降级：纯文本输入、降价至 1/2、
# 撤销缓存读价、上下文改 1024 进制 1M、最大输出降为 64K；模型级 supportedParameters 仅 top_k
# （无 temperature），reasoning 官方值为 "none"，与 censored 版同值语义未明，保持省略不推断。
base_model = "deepseek/deepseek-v4.1-flash"
