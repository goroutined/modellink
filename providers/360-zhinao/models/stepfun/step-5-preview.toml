# 2026-11-12 上线（详情页日期 2026/11/12）。官方详情页逐字：推理「可切换推理」；
# 支持的参数仅 temperature/top_p/top_k（无 tools/tool_choice/response_format），
# tool_call/structured_output 按 360 侧无证据惯例 omit，描述中「调用工具」
# 为任务场景描述不作 API 字段证据；响应格式三端点；
# 上下文 1,000,000、最大输出 64,000；描述「原生支持文本、图片和视频输入」。
base_model = "stepfun/step-5-preview"
# 输入上限 360 结构化数据未发布（仅 contextLength/maxCompletionTokens），随惯例省略。
base_model_omit = ["tool_call", "structured_output", "limit.input"]
endpoints = ["openai", "responses", "anthropic"]
doc = "https://ai.360.com/open/zh/models/stepfun/step-5-preview"
reasoning = true
temperature = true

[limit]
context = 1_000_000
output = 64_000

[cost_cn]
input = 7
output = 20
cache_read = 0.7
