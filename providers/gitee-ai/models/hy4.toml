# serverless 服务 32032；operations 计费策略 prompt_cache_tokens 四价（average 口径，
# 与 kimi 系列入库数据源一致；off_peak 段无时间窗口定义，按先例不入）。
# tags 仅 text-generation + 1024k、type=text2text，按 Gitee 精确记录覆盖为纯文本输入；
# params 含 temperature（0-1 可调）与 tools（支持 function call）；
# 无思考控制参数，reasoning/structured_output 按 Gitee 无证据惯例 omit。
base_model = "tencent/hy4"
base_model_omit = ["reasoning", "structured_output", "limit.input", "limit.output"]
doc = "https://moark.com/serverless-api?service=32032"
attachment = false
temperature = true
tool_call = true

[limit]
context = 1_048_576

[modalities]
input = ["text"]
output = ["text"]

[cost_cn]
input = 6
output = 18
cache_read = 0.3
cache_write = 6
