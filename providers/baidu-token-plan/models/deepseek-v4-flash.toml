base_model = "deepseek/deepseek-v4-flash"
base_model_omit = ["tool_call"]
endpoints = ["openai", "anthropic"]
doc = "https://cloud.baidu.com/doc/qianfan/s/Smoghsq3g"
temperature = false

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["openai"]

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["high", "max"]
default = "high"

[limit]
context = 1_155_072
input = 1_024_000
output = 131_072

[cost_points]
per_tokens = 1_000
input = 1
output = 2
cache_read = 0.2
