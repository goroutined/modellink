# 2026-11-26 收录：Coding Plan 支持模型表新增行「GLM-5.4 长度限制如下：
# 上下文窗口 1024K、最大输出长度 128K」。2026-11-27 官方表新增「输入模态」列，
# GLM-5.4 行为「文本、图片、视频」，attachment 改 true、输入补 image/video。
# 该行仍无思考标注（对照 glm-5.3 行无思考说明），reasoning 按
# glm-5.3-flash 先例 omit。
base_model = "zhipu/glm-5.4"
base_model_omit = ["reasoning", "temperature", "tool_call", "structured_output", "reasoning_options", "interleaved"]
endpoints = ["openai", "anthropic"]
doc = "https://www.volcengine.com/docs/82379/1925114"

[limit]
context = 1_024_000
output = 131_072

[modalities]
input = ["text", "image", "video"]
output = ["text"]
