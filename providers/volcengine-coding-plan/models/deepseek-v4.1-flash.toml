base_model = "deepseek/deepseek-v4.1-flash"
endpoints = ["openai", "anthropic"]
base_model_omit = ["temperature", "structured_output"]
doc = "https://www.volcengine.com/docs/82379/1925114"

[[reasoning_options]]
type = "toggle"

[limit]
context = 1_024_000
output = 384_000

# 2026-11-27 官方表新增「输入模态」列：文本、图片、视频。
[modalities]
input = ["text", "image", "video"]
output = ["text"]
