base_model = "moonshot/kimi-k3.1-pro"
endpoints = ["openai", "anthropic"]
base_model_omit = ["reasoning", "temperature", "tool_call", "structured_output", "reasoning_options", "interleaved", "limit.input"]
doc = "https://www.volcengine.com/docs/82379/1925114"

[limit]
context = 1_024_000
output = 1_048_576

# 2026-11-27 官方表新增「输入模态」列：文本、图片、视频。
[modalities]
input = ["text", "image", "video"]
output = ["text"]
