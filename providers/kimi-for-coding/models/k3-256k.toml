base_model = "moonshot/kimi-k3"
base_model_omit = ["limit.output"]
endpoints = ["openai", "anthropic"]
doc = "https://www.kimi.com/code/docs/kimi-code/models.html"

[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai"]
values = ["low", "high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
