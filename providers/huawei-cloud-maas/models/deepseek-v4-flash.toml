base_model = "deepseek/deepseek-v4-flash"
base_model_omit = ["structured_output"]
endpoints = ["openai", "anthropic"]
doc = "https://support.huaweicloud.com/model-list-maas/model_list_0001.html"
temperature = false
structured_output = false

[[reasoning_options]]
type = "toggle"
field = "chat_template_kwargs.thinking"
endpoints = ["openai"]

[[reasoning_options]]
type = "toggle"
field = "thinking.type"
endpoints = ["anthropic"]

# 两种协议均明确 DeepSeek-V4 系列使用 reasoning_effort，思考模式下生效。
# https://support.huaweicloud.com/model-call-maas/model-call-021.html
# https://support.huaweicloud.com/model-call-maas/model-call-022.html
[[reasoning_options]]
type = "effort"
field = "reasoning_effort"
endpoints = ["openai", "anthropic"]
values = ["high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 1_048_576
output = 393_216

[cost_cn]
input = 2
output = 4

[[cost_cn.tiers]]
input = 2
output = 4

[cost_cn.tiers.tier]
type = "conditional"
label = "时段 1"

[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.tier.time.windows]]
start = "08:00"
end = "21:00"

[[cost_cn.tiers]]
input = 1.4
output = 2.8

[cost_cn.tiers.tier]
type = "conditional"
label = "时段 2"

[cost_cn.tiers.tier.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.tier.time.windows]]
start = "21:00"
end = "24:00"

[[cost_cn.tiers.tier.time.windows]]
start = "00:00"
end = "08:00"
