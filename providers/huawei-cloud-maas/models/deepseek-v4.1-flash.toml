base_model = "deepseek/deepseek-v4.1-flash"
base_model_omit = ["structured_output"]
endpoints = ["openai", "anthropic"]
doc = "https://support.huaweicloud.com/model-call-maas/model-call-021.html"

[[reasoning_options]]
type = "toggle"
field = "chat_template_kwargs.thinking"
endpoints = ["openai", "anthropic"]

[[reasoning_options]]
type = "effort"
field = "chat_template_kwargs.reasoning_effort"
endpoints = ["openai", "anthropic"]
values = ["low", "high", "max"]
default = "high"

[interleaved]
field = "reasoning_content"

[limit]
context = 1_048_576
input = 1_048_576
output = 393_216

[cost_cn]
input = 2
output = 8
cache_read = 0.2

[[cost_cn.tiers]]
label = "时段 1"
input = 2
output = 8
cache_read = 0.2

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "08:00"
end = "21:00"


[[cost_cn.tiers]]
label = "时段 2"
input = 1
output = 4
cache_read = 0.1

[cost_cn.tiers.when]
type = "conditional"

[cost_cn.tiers.when.time]
timezone = "Asia/Shanghai"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "21:00"
end = "24:00"

[[cost_cn.tiers.when.time.windows]]
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
start = "00:00"
end = "08:00"
