<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ModelLink：中国 AI 模型与服务商的开源目录">
  <meta name="theme-color" content="#f6f7f3">
  <title>ModelLink · 中国 AI 模型与服务商目录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/models" aria-label="ModelLink 首页">
        <span class="brand-mark">M</span>
        <span><strong>ModelLink</strong><small>中国 AI 模型与服务商目录</small></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#/models" data-nav="models">模型</a>
        <a href="#/providers" data-nav="providers">服务商</a>
        <a href="#/labs" data-nav="labs">研发机构</a>
      </nav>
      <button class="global-search" id="global-search-trigger" type="button" aria-haspopup="dialog" aria-controls="global-search-dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <span class="global-search-label">搜索模型、服务商和研发机构</span>
        <kbd id="search-shortcut" aria-label="搜索快捷键" hidden></kbd>
      </button>
    </div>
  </header>

  <dialog class="global-search-dialog" id="global-search-dialog" aria-label="全站搜索">
    <div class="global-search-panel">
      <div class="global-search-input-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="global-search-input" type="search" placeholder="搜索模型、服务商和研发机构" autocomplete="off" spellcheck="false">
        <button id="global-search-close" type="button" aria-label="关闭搜索">×</button>
      </div>
      <div class="global-search-results" id="global-search-results" role="listbox" aria-label="搜索结果"></div>
      <div class="global-search-footer" aria-hidden="true"><span>↑↓ 选择</span><span>Enter 打开</span><span>Esc 关闭</span></div>
    </div>
  </dialog>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-state">正在加载模型目录…</section>
  </main>

  <footer class="site-footer">
    <div>
      <strong>ModelLink</strong> 是面向中国开发者的开源 AI 模型与服务商目录。
    </div>
    <div class="footer-links">
      <a href="https://models.dev" target="_blank" rel="noreferrer">数据格式兼容 models.dev</a>
      <a href="https://github.com/goroutined/modellink" target="_blank" rel="noreferrer">查看 ModelLink GitHub 源码</a>
      <a href="catalog.json">下载 catalog.json</a>
    </div>
  </footer>

  <noscript>此页面需要启用 JavaScript 才能浏览模型目录。</noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
