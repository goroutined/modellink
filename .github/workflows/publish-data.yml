name: Publish data package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the data-v prefix
        required: true
        type: string
      publish:
        description: Publish to npm after building
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'data-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: false
      - name: Resolve package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            version="${RELEASE_TAG#data-v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:data -- --version "${{ steps.version.outputs.version }}"
      - run: bun run verify:data
      - name: Pack npm artifact
        run: npm pack .artifacts/npm --pack-destination .artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: modellink-data-${{ steps.version.outputs.version }}
          path: .artifacts/modellink-data-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish to npm
        if: github.event_name == 'release' || inputs.publish
        run: npm publish .artifacts/npm --access public
