name: Validate catalog

on:
  push:
    paths:
      - 'labs/**'
      - 'models/**'
      - 'providers/**'
      - 'packages/core/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'labs/**'
      - 'models/**'
      - 'providers/**'
      - 'packages/core/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
